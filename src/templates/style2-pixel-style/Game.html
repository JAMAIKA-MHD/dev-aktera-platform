<style>
html,body{height:100%}
body{margin:0;overflow:hidden;background:#0f2a66}

/* one 1280x720 stage, scaled to fit the window; every screen lives inside it */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;overflow:hidden;transform:scale(var(--fit,1));transform-origin:50% 50%}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
/* the scenery is identical on every screen, so the old screen just dissolves in chunky steps */
.screen.leaving{display:block;z-index:2;pointer-events:none;animation:screenOut 0.4s steps(5,end) forwards}
@keyframes screenOut{to{opacity:0}}

/* buttons */
.pxbtn{position:relative;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:0;padding:0 16px;text-decoration:none;cursor:pointer;font-family:'Press Start 2P',monospace;letter-spacing:2px;color:#6a2d1f;background:#5a2518;clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px);transition:transform .08s,filter .08s}
.pxbtn::before{content:"";position:absolute;inset:4px;background:linear-gradient(#fbd978 0,#fbd978 22%,#f2b84c 22%,#f2b84c 52%,#e8a03a 52%,#e8a03a 78%,#cf8429 78%);clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
.pxbtn::after{content:"";position:absolute;inset:4px;pointer-events:none;background:linear-gradient(#fff 0 0) 14px 6px/20px 4px no-repeat,linear-gradient(#fff 0 0) 38px 6px/4px 4px no-repeat,linear-gradient(#ffffffb0 0 0) 72% 36%/10px 4px no-repeat,linear-gradient(#ffffffb0 0 0) 88% 52%/4px 4px no-repeat}
.pxbtn>span{position:relative;z-index:1;text-shadow:2px 2px 0 #ffe9a8}
.pxbtn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}
.pxbtn:active:not(:disabled){transform:translateY(3px)}
.pxbtn:focus-visible{background:#1747a8}
.pxbtn:disabled{filter:grayscale(.6) brightness(.92);cursor:default}

/* login */
input::placeholder{color:#5a6f94}
input:focus{outline:4px solid #f2a516;outline-offset:2px}
.foot a{color:#ffb53b;text-decoration:none}
.foot a:hover{color:#ffffff}

/* win */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:0.25}}
.bob{animation:bob 1s steps(2) infinite}
.tw{animation:twinkle 1.2s steps(2) infinite}

/* lose */
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wobble{animation:wobble 0.9s steps(4) infinite}

@media (prefers-reduced-motion: reduce){
.screen.leaving{animation-duration:0.01s}
.bob,.tw,.wobble{animation:none}
}

#stage{width:var(--cw,1280px);height:var(--ch,720px);margin:calc(var(--ch,720px) / -2) 0 0 calc(var(--cw,1280px) / -2)}

  // ---- fit the stage to the window ----
  // landscape: the 1280x720 canvas. portrait (phone): a 390-wide canvas whose
  // height follows the screen, laid out by the max-aspect-ratio rules in the CSS
  var phone = window.matchMedia('(max-aspect-ratio: 1/1)');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, s;
    if (phone.matches) {
      var ph = Math.max(640, Math.min(900, 390 * h / w));
      stage.style.setProperty('--ph', ph + 'px');
      s = Math.min(w / 390, h / ph);
    } else {
      // desktop: the canvas takes the window's shape (never smaller than 1280x720)
      var cw = 1280, ch = 720;
      if (w / h >= 16 / 9) cw = Math.min(1760, 720 * w / h); else ch = Math.min(1280, 1280 * h / w);
      stage.style.setProperty('--cw', cw + 'px');
      stage.style.setProperty('--ch', ch + 'px');
      s = Math.min(w / cw, h / ch);
    }
    stage.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  // ---- screen switching ----
  function go(name) {
    if (name === current || !screens[name]) return;
    var from = screens[current], to = screens[name];
    Object.keys(screens).forEach(function (k) { screens[k].classList.remove('leaving'); });
    from.classList.remove('active');
    from.classList.add('leaving');
    to.classList.add('active');
    current = name;
    // fallback in case the browser skips the animationend event (e.g. a background tab)
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(function () { from.classList.remove('leaving'); }, 600);
    if (name === 'wheel') resetWheel();
    if (name === 'login') resetLogin();
    var focusTarget = to.querySelector('[data-go], #spinBtn');
    if (name !== 'login' && focusTarget) focusTarget.focus({ preventScroll: true });
  }
  stage.addEventListener('animationend', function (e) {
    if (e.animationName === 'screenOut') e.target.classList.remove('leaving');
  });
  stage.addEventListener('click', function (e) {
    var link = e.target.closest('[data-go]');
    if (!link) return;
    e.preventDefault();
    go(link.getAttribute('data-go'));
  });
  stage.addEventListener('keydown', function (e) {
    // role="button" links should also respond to Space
    if (e.key === ' ' && e.target.matches('a[data-go]')) { e.preventDefault(); e.target.click(); }
  });

  // ---- login ----
  var form = document.getElementById('loginForm');
  var pw = document.getElementById('password');
  var togglePw = document.getElementById('togglePw');
  function setPwVisible(show) {
    pw.type = show ? 'text' : 'password';
    togglePw.firstElementChild.textContent = show ? 'HIDE' : 'SHOW';
    togglePw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }
  togglePw.addEventListener('click', function () { setPwVisible(pw.type === 'password'); });
  form.addEventListener('submit', function (e) { e.preventDefault(); go('wheel'); });
  form.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go('wheel'); }
  });
  function resetLogin() {
    pw.value = '';
    setPwVisible(false);
  }

  // ---- wheel ----
  var wheel = document.getElementById('wheel');
  var spinBtn = document.getElementById('spinBtn');
  var spinLabel = spinBtn.firstElementChild;
  var SPIN_MS = 4600, RESULT_PAUSE_MS = 700;
  var angle = 0, spinning = false, timer = null;

  function resetWheel() {
    clearTimeout(timer);
    spinning = false;
    // keep the wheel where it stopped, but drop the full turns so the next spin starts clean
    angle = ((angle % 360) + 360) % 360;
    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(' + angle + 'deg)';
    spinBtn.disabled = false;
    spinLabel.textContent = 'SPIN!';
  }
  function spin() {
    if (spinning || current !== 'wheel') return;
    spinning = true;
    var idx = Math.floor(Math.random() * 8);      // 8 segments, even ones are WIN
    var jitter = (Math.random() - 0.5) * 30;
    var win = idx % 2 === 0;
    angle = Math.ceil(angle / 360) * 360 + 360 * 5 + ((360 - idx * 45) % 360) + jitter;
    spinBtn.disabled = true;
    spinLabel.textContent = '...';
    wheel.getBoundingClientRect();                // flush so the transition starts from the resting angle
    wheel.style.transition = 'transform ' + SPIN_MS + 'ms cubic-bezier(0.12, 0.6, 0.1, 1)';
    wheel.style.transform = 'rotate(' + angle + 'deg)';
    timer = setTimeout(function () {
      if (current === 'wheel') go(win ? 'win' : 'lose');
    }, SPIN_MS + RESULT_PAUSE_MS);
  }
  spinBtn.addEventListener('click', spin);
})();
</script>
</body></html>
