<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="270" height="312"><style>.joy-stick{transform-box:view-box;transform-origin:130px 180px;animation:tilt 2.6s ease-in-out infinite}@keyframes tilt{0%,100%{rotate:-6deg}50%{rotate:6deg}}.pb{animation:press 1.2s steps(1,end) infinite}.pb2{animation-delay:.6s}@keyframes press{50%{translate:0 3px;opacity:.75}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><polygon points="20,196 190,174 250,218 238,268 40,290 10,244" fill="#4f4aa8"/><polygon points="20,196 190,174 250,218 62,240" fill="#7c76dc"/><g class="joy-stick"><path d="M114 178 L134 78 L152 82 L142 184Z" fill="#dcd8f2"/><circle cx="146" cy="56" r="44" fill="#ff5fae"/><circle cx="130" cy="40" r="12" fill="#fff" opacity=".35"/></g><ellipse class="pb" cx="46" cy="228" rx="26" ry="13" fill="#ff5fae"/><ellipse class="pb pb2" cx="206" cy="240" rx="26" ry="13" fill="#ff5fae"/></svg>
