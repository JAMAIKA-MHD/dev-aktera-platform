<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#3a2a9f"/>
      <stop offset=".6" stop-color="#0a0b33"/>
      <stop offset="1" stop-color="#04051a"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1280" height="720" fill="url(#fade)"/></mask>
    <polygon id="ray" points="640,360 1500,300 1500,420"/>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <g mask="url(#m)" fill="#ffb020" fill-opacity=".22">
    <use href="#ray" transform="rotate(0 640 360)"/><use href="#ray" transform="rotate(30 640 360)"/>
    <use href="#ray" transform="rotate(60 640 360)"/><use href="#ray" transform="rotate(90 640 360)"/>
    <use href="#ray" transform="rotate(120 640 360)"/><use href="#ray" transform="rotate(150 640 360)"/>
    <use href="#ray" transform="rotate(180 640 360)"/><use href="#ray" transform="rotate(210 640 360)"/>
    <use href="#ray" transform="rotate(240 640 360)"/><use href="#ray" transform="rotate(270 640 360)"/>
    <use href="#ray" transform="rotate(300 640 360)"/><use href="#ray" transform="rotate(330 640 360)"/>
  </g>
  <circle cx="640" cy="360" r="120" fill="#ffc94a" fill-opacity=".12"/>
  <circle cx="640" cy="360" r="220" fill="none" stroke="#ffc94a" stroke-opacity=".2" stroke-width="2"/>
</svg>
