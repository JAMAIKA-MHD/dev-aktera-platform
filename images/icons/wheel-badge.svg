<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Dark Rim -->
  <circle cx="100" cy="100" r="98" fill="#2B303A" />
  
  <!-- Wheel Segments Background & Wedges -->
  <g transform="rotate(-22.5 100 100)">
    <!-- 8 Segments (45 deg each) -->
    <!-- Segment 1: Yellow -->
    <path d="M 100 100 L 100 10 A 90 90 0 0 1 163.64 36.36 Z" fill="#FBBF24" />
    <!-- Segment 2: Lime Green -->
    <path d="M 100 100 L 163.64 36.36 A 90 90 0 0 1 190 100 Z" fill="#84CC16" />
    <!-- Segment 3: Sky Blue -->
    <path d="M 100 100 L 190 100 A 90 90 0 0 1 163.64 163.64 Z" fill="#38BDF8" />
    <!-- Segment 4: Red -->
    <path d="M 100 100 L 163.64 163.64 A 90 90 0 0 1 100 190 Z" fill="#EF4444" />
    <!-- Segment 5: Yellow -->
    <path d="M 100 100 L 100 190 A 90 90 0 0 1 36.36 163.64 Z" fill="#FBBF24" />
    <!-- Segment 6: Lime Green -->
    <path d="M 100 100 L 36.36 163.64 A 90 90 0 0 1 10 100 Z" fill="#84CC16" />
    <!-- Segment 7: Sky Blue -->
    <path d="M 100 100 L 10 100 A 90 90 0 0 1 36.36 36.36 Z" fill="#38BDF8" />
    <!-- Segment 8: Red -->
    <path d="M 100 100 L 36.36 36.36 A 90 90 0 0 1 100 10 Z" fill="#EF4444" />
  </g>

  <!-- Outer Dark Ring Border Overlay -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#262A33" stroke-width="14" />

  <!-- Silver/White Studs around the rim -->
  <circle cx="100" cy="15" r="3.5" fill="#F8FAFC" />
  <circle cx="160" cy="40" r="3.5" fill="#F8FAFC" />
  <circle cx="185" cy="100" r="3.5" fill="#F8FAFC" />
  <circle cx="160" cy="160" r="3.5" fill="#F8FAFC" />
  <circle cx="100" cy="185" r="3.5" fill="#F8FAFC" />
  <circle cx="40" cy="160" r="3.5" fill="#F8FAFC" />
  <circle cx="15" cy="100" r="3.5" fill="#F8FAFC" />
  <circle cx="40" cy="40" r="3.5" fill="#F8FAFC" />

  <!-- Center Hub Outer Ring -->
  <circle cx="100" cy="100" r="32" fill="#2B303A" />
  <!-- Center White Circle -->
  <circle cx="100" cy="100" r="28" fill="#FFFFFF" />
  <!-- Center "SPIN" Text -->
  <text x="100" y="107" text-anchor="middle" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="1">SPIN</text>

  <!-- Top Pointer (Golden Arrow / Shield pointing down) -->
  <polygon points="100,24 88,4 112,4" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" />
</svg>
