<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Circular Charcoal Badge -->
  <circle cx="100" cy="100" r="98" fill="#2B303A" />
  
  <!-- Subtle inner border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3A404D" stroke-width="2" />

  <!-- Diagonal Drop Shadow effect -->
  <path d="M 120 45 L 180 105 L 180 180 L 105 180 Z" fill="#22262E" opacity="0.6" />

  <!-- Stopwatch Top Ring & Button -->
  <circle cx="100" cy="36" r="14" fill="none" stroke="#FF4D4D" stroke-width="4.5" />
  <rect x="94" y="44" width="12" height="10" rx="2" fill="#FF4D4D" />
  <!-- Stopwatch Side Buttons -->
  <rect x="68" y="48" width="8" height="5" rx="1.5" transform="rotate(-35 72 50)" fill="#FF4D4D" />
  <rect x="124" y="48" width="8" height="5" rx="1.5" transform="rotate(35 128 50)" fill="#FF4D4D" />

  <!-- Stopwatch Outer Dial -->
  <circle cx="100" cy="85" r="38" fill="none" stroke="#FF4D4D" stroke-width="5" />

  <!-- Dial Tick Marks -->
  <circle cx="100" cy="52" r="1.5" fill="#FF4D4D" />
  <circle cx="133" cy="85" r="1.5" fill="#FF4D4D" />
  <circle cx="100" cy="118" r="1.5" fill="#FF4D4D" />
  <circle cx="67" cy="85" r="1.5" fill="#FF4D4D" />
  <circle cx="123" cy="62" r="1.5" fill="#FF4D4D" />
  <circle cx="123" cy="108" r="1.5" fill="#FF4D4D" />
  <circle cx="77" cy="62" r="1.5" fill="#FF4D4D" />
  <circle cx="77" cy="108" r="1.5" fill="#FF4D4D" />

  <!-- Center Checkmark -->
  <path d="M 86 85 L 96 95 L 116 73" fill="none" stroke="#FF4D4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- QUIZ Bold Text -->
  <text x="100" y="160" text-anchor="middle" fill="#FF4D4D" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1">QUIZ</text>
</svg>
